package:
  name: wasm-bindgen
  version: 0.2.130
  epoch: 0
  description: Facilitating high-level interactions between Wasm modules and JavaScript
  copyright:
    - license: Apache-2.0

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub

pipeline:
  - uses: git-checkout
    with:
      expected-commit: c93b8ae848d4d9e6beaeaf9516e18a7cadd818a2
      repository: https://github.com/wasm-bindgen/wasm-bindgen
      tag: ${{package.version}}
  - uses: cargo/build
    with:
      modroot: crates/cli
      output: wasm-bindgen
